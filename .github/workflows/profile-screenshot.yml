name: Update Profile Screenshot

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture profile page
        run: |
          cat > screenshot.js <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1200,
                height: 900
              },
              deviceScaleFactor: 1
            });

            await page.goto(
              "https://1976764.github.io/1976764/",
              {
                waitUntil: "networkidle",
                timeout: 120000
              }
            );

            await page.waitForTimeout(3000);

            await page.screenshot({
              path: "profile-preview.png",
              fullPage: true,
              animations: "disabled"
            });

            await browser.close();

            console.log("Screenshot completed.");
          })();
          EOF

          node screenshot.js

      - name: Update README
        run: |
          python3 -c '
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")

          start = "<!-- PROFILE_PREVIEW_START -->"
          end = "<!-- PROFILE_PREVIEW_END -->"

          replacement = """<!-- PROFILE_PREVIEW_START -->

          <p align="center">
            <img src="./profile-preview.png" alt="CARY_A Profile">
          </p>

          <!-- PROFILE_PREVIEW_END -->"""

          if start in content and end in content:
              before = content.split(start, 1)[0]
              after = content.split(end, 1)[1]
              content = before + replacement + after
          else:
              content = replacement + "\n\n" + content

          path.write_text(content, encoding="utf-8")
          '

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile-preview.png

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update profile screenshot [skip ci]"
          git push
